# Whether to show trayicon, yes/no
trayicon = yes

[switch-windows]

# Hotkey to switch windows (multiple hotkeys can be separated by ||)
# Examples: alt+`, ctrl+space, alt, alt || alt+`
# Bare alt means left Alt tapped alone; other Alt shortcuts do not trigger it.
hotkey = alt+`

# Keep cycling across releases instead of returning to the previous window.
# yes: A, B, C, A; no: A, B, A after releasing the modifier.
# Independent of the hotkey: works with both chords and a bare Alt tap.
persistent_cycle = no

# Only enable window switching in these apps; empty means all apps.
# Comma-separated executable names, matched case-insensitively.
# Example: chrome.exe,code.exe,notepad.exe
allowlist =

# List of hotkey conflict apps
# Denylist takes precedence over allowlist.
# The legacy key blacklist is accepted only when denylist is absent.
# e.g. game1.exe,game2.exe
denylist =

# Ignore minimal windows
ignore_minimal = no

# Switch to windows from only the current virtual desktops instead of all desktops.
# Defaults to match the Alt-Tab behavior of Windows:
# Settings > System > Multitasking > Virtual Desktops
only_current_desktop = auto

[switch-apps]

# Whether to enable switching apps
enable = no

# Hotkey to switch apps (multiple hotkeys can be separated by ||)
hotkey = alt+tab

# Ignore minimal windows
ignore_minimal = no

# List of override icons, syntax: app1.exe=icon1.ico,app2.exe=icon2.png.
# The icon path can be a full path or a relative path to the app's directory.
# The icon format can be ico or png.
override_icons =

# Switch to apps from only the current virtual desktops instead of all desktops.
# Defaults to match the Alt-Tab behavior of Windows:
# Settings > System > Multitasking > Virtual Desktops
only_current_desktop = auto

[log]

# Log level can be one of off,error,warn,info,debug,trace.
level = info

# Log file path.
# e.g.
#   window-switcher.log (located in the same directory as window-switcher.exe)
#   C:\Users\YourName\AppData\Local\Temp\window-switcher.log (or use the full path)
path =
# Configuration for https://github.com/andytung/window-switcher
# Keep this file beside window-switcher.exe and restart after editing.

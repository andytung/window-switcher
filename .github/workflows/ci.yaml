name: CI

on:
  pull_request:
    branches:
    - '*'
  push:
    branches:
    - main
    - 'andytung/**'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  all:
    name: All

    strategy:
      matrix:
        target:
        - x86_64-pc-windows-msvc
        include:
        - target: x86_64-pc-windows-msvc
          os: windows-latest

    runs-on: ${{matrix.os}}

    env:
      RUSTFLAGS: --deny warnings
      # Rust 1.98 adds Clippy diagnostics in unchanged upstream icon code.
      RUSTUP_TOOLCHAIN: 1.97.0

    steps:
    - uses: actions/checkout@v6

    - name: Install Rust Toolchain Components
      run: |
        rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt,clippy
        rustup target add ${{ matrix.target }}

    - name: Test
      run: cargo test --locked --target=${{ matrix.target }} --all

    - name: Clippy
      run: cargo clippy --locked --all --all-targets

    - name: Format
      run: cargo fmt --all --check

    - name: Build Windows executable
      run: |
        cargo build --locked --release --target=${{ matrix.target }}
        mkdir -p dist
        cp target/${{ matrix.target }}/release/window-switcher.exe window-switcher.ini LICENSE dist/

    - name: Upload Windows executable and configuration
      uses: actions/upload-artifact@v4
      with:
        name: window-switcher-windows-x64
        path: dist/
        if-no-files-found: error